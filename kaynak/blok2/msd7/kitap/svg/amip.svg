<line x1="480" y1="76" x2="532" y2="94" stroke="#8a1c3c" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="476.0" y="72.0" text-anchor="end" font-size="9.5" font-weight="700" fill="#8a1c3c">dar ağız</text>
<line x1="650" y1="160" x2="598" y2="160" stroke="#8a1c3c" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="654.0" y="164.0" text-anchor="start" font-size="9.5" font-weight="700" fill="#8a1c3c">geniş taban</text>
<rect x="410" y="206" width="280" height="42" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="550.0" y="218.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">Kan yoluyla karaciğer absesi</text><text x="550.0" y="231.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">en sık bağırsak dışı tutulum; erkekte sık</text><text x="550.0" y="244.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">"çikolata sosu" irin, sağ üst kadran ağrısı</text>
<rect x="410" y="258" width="280" height="28" rx="4" fill="#faf7f2" stroke="#3a3533"/><text x="550.0" y="276.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">Tedavi: METRONİDAZOL + luminal ilaç</text>
