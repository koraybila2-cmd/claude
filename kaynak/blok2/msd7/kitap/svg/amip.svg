<line x1="95" y1="192" x2="95" y2="212" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="20" y="212" width="150" height="44" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="95.0" y="225.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">TROFOZOİT (kolonda)</text><text x="95.0" y="238.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">alyuvar fagositozu yapar</text><text x="95.0" y="251.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">= patojenliğin kanıtı</text>
<line x1="170" y1="234" x2="215" y2="190" stroke="#2e7d4f" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="170" y1="240" x2="215" y2="285" stroke="#8a1c3c" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="218" y="162" width="160" height="42" rx="4" fill="#e6f0ea" stroke="#2e7d4f"/><text x="298.0" y="174.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">Kolona iner → KİST</text><text x="298.0" y="187.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">asemptomatik taşıyıcı</text><text x="298.0" y="200.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">en bulaştırıcı grup</text>
<rect x="218" y="265" width="160" height="42" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="298.0" y="277.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">Mukozaya invazyon</text><text x="298.0" y="290.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">kollajenaz, nöraminidaz</text><text x="298.0" y="303.0" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">nötrofiller eritilir</text>
<text x="550.0" y="76.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">Şişe (matara) ağzı ülser</text>
