<svg viewBox="0 0 710 308" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Antihelmintik ilaclarin etki noktalari ve felc tipleri">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<text x="355.0" y="20.0" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3533">Antihelmintikler paraziti nasıl felç eder?</text>
<rect x="210" y="46" width="290" height="120" rx="10" fill="#fbf9f6" stroke="#3a3533" stroke-width="1.4"/>
<text x="355.0" y="62.0" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">Parazitin kas hücresi</text>
<rect x="222" y="74" width="128" height="36" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="286.0" y="89.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a3533">Nikotinik reseptör</text><text x="286.0" y="102.5" text-anchor="middle" font-size="8.0" font-weight="400" fill="#3a3533">Na⁺ girer → depolarizasyon</text>
<rect x="360" y="74" width="128" height="36" rx="4" fill="#e8f0f4" stroke="#0b6e99"/><text x="424.0" y="89.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a3533">Klor kanalı</text><text x="424.0" y="102.5" text-anchor="middle" font-size="8.0" font-weight="400" fill="#3a3533">Cl⁻ girer → hiperpolarizasyon</text>
<rect x="222" y="122" width="128" height="34" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="286.0" y="136.5" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">SPASTİK FELÇ</text><text x="286.0" y="149.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">kas sürekli kasılır</text>
<rect x="360" y="122" width="128" height="34" rx="4" fill="#e8f0f4" stroke="#0b6e99"/><text x="424.0" y="136.5" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">FLASK (GEVŞEK) FELÇ</text><text x="424.0" y="149.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">kas gevşer</text>
<line x1="286" y1="110" x2="286" y2="120" stroke="#8a1c3c" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="424" y1="110" x2="424" y2="120" stroke="#0b6e99" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="20" y="74" width="170" height="36" rx="4" fill="#fff" stroke="#8a1c3c"/><text x="105.0" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">Pirantel pamoat</text><text x="105.0" y="102.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">Levamizol</text>
<line x1="192" y1="92" x2="220" y2="92" stroke="#8a1c3c" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="520" y="74" width="170" height="36" rx="4" fill="#fff" stroke="#0b6e99"/><text x="605.0" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">İvermektin</text><text x="605.0" y="102.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">Piperazin (GABA agonisti)</text>
<line x1="518" y1="92" x2="490" y2="92" stroke="#0b6e99" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="355.0" y="190.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">Felç yapmayanlar: enerji ve iskelet hedefli</text>
<rect x="20" y="202" width="210" height="54" rx="4" fill="#e6f0ea" stroke="#2e7d4f"/><text x="125.0" y="220.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">BENZİMİDAZOLLER</text><text x="125.0" y="233.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">Albendazol · Mebendazol · Tiabendazol</text><text x="125.0" y="246.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">β-tubulin → mikrotübül yapılamaz → glukoz alımı ve ATP ↓</text>
<rect x="245" y="202" width="210" height="54" rx="4" fill="#f6e9df" stroke="#b4541a"/><text x="350.0" y="220.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">NİKLOZAMİD</text><text x="350.0" y="233.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">Oksidatif fosforilasyonu ayırır</text><text x="350.0" y="246.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">ATP üretilemez (yalnız lümende etkili)</text>
<rect x="470" y="202" width="220" height="54" rx="4" fill="#efe7f2" stroke="#5b3f8c"/><text x="580.0" y="220.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">PRAZİKUANTEL</text><text x="580.0" y="233.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">Ca²⁺ geçirgenliği ↑ → SPASTİK felç</text><text x="580.0" y="246.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">+ tegüment hasarı (sestod ve trematod)</text>
<rect x="130" y="268" width="450" height="26" rx="4" fill="#faf7f2" stroke="#8a1c3c"/><text x="355.0" y="285.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">Pirantel (spastik) + Piperazin (flask) ZIT etkilidir: birlikte verilmez</text>
</svg>
