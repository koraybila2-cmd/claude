<svg viewBox="0 0 710 444" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Helmintlerin insana bulas yollari">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<text x="350.0" y="20.0" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3533">Helmintler insana nasıl girer?</text>
<rect x="20" y="46" width="200" height="76" rx="4" fill="#fff" stroke="#0b6e99"/><text x="120.0" y="88.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">AĞIZ: yumurta yutulur</text>
<line x1="224" y1="84.0" x2="250" y2="84.0" stroke="#0b6e99" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="256.0" y="64.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Ascaris lumbricoides (embriyonlu yumurta)</text>
<text x="256.0" y="78.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Trichuris trichiura (limon yumurta)</text>
<text x="256.0" y="92.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Enterobius vermicularis (perianal yumurta)</text>
<text x="256.0" y="106.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Hymenolepis nana · Taenia solium yumurtası → sistiserkoz</text>
<rect x="20" y="134" width="200" height="62" rx="4" fill="#fff" stroke="#8a1c3c"/><text x="120.0" y="169.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">DERİ: larva girer</text>
<line x1="224" y1="165.0" x2="250" y2="165.0" stroke="#8a1c3c" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="256.0" y="152.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Ancylostoma duodenale · Necator americanus</text>
<text x="256.0" y="166.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Strongyloides stercoralis</text>
<text x="256.0" y="180.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· (filariform larva)</text>
<rect x="20" y="208" width="200" height="76" rx="4" fill="#fff" stroke="#b4541a"/><text x="120.0" y="250.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">AĞIZ: etteki larva</text>
<line x1="224" y1="246.0" x2="250" y2="246.0" stroke="#b4541a" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="256.0" y="226.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Taenia saginata (çiğ sığır eti)</text>
<text x="256.0" y="240.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Taenia solium (çiğ domuz eti)</text>
<text x="256.0" y="254.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Trichinella spiralis (domuz)</text>
<text x="256.0" y="268.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Diphyllobothrium latum (çiğ balık)</text>
<rect x="20" y="296" width="200" height="62" rx="4" fill="#fff" stroke="#2e7d4f"/><text x="120.0" y="331.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">AĞIZ: su bitkisi / ara konak</text>
<line x1="224" y1="327.0" x2="250" y2="327.0" stroke="#2e7d4f" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="256.0" y="314.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Fasciola hepatica (su teresi)</text>
<text x="256.0" y="328.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Fasciolopsis buski (su bitkisi)</text>
<text x="256.0" y="342.0" text-anchor="start" font-size="9.8" font-weight="400" fill="#3a3533">· Clonorchis (balık) · Hymenolepis nana (pire)</text>
<rect x="20" y="374" width="670" height="26" rx="4" fill="#faf7f2" stroke="#3a3533"/><text x="355.0" y="391.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">Helmintler insan bağırsağında ÇOĞALMAZ: hastalığın ağırlığını alınan parazit sayısı belirler</text>
<rect x="20" y="406" width="670" height="26" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="355.0" y="423.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">İstisna — otoenfeksiyon: Strongyloides stercoralis, Enterobius vermicularis, Hymenolepis nana</text>
</svg>
