<svg viewBox="0 0 710 345" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Ozmotik ve sekretuvar ishal ayrimi karar semasi">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<text x="350.0" y="22.0" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3533">İshalin mekanizmasına nasıl karar verilir?</text>
<rect x="250" y="38" width="200" height="30" rx="4" fill="#faf7f2" stroke="#3a3533"/><text x="350.0" y="57.0" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">Sulu ishali olan hasta</text>
<line x1="350" y1="68" x2="350" y2="88" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="230" y="88" width="240" height="30" rx="4" fill="#fff" stroke="#3a3533"/><text x="350.0" y="107.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3a3533">48 saat aç bırak (ya da oruç)</text>
<line x1="300" y1="118" x2="170" y2="148" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="400" y1="118" x2="540" y2="148" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="60" y="148" width="220" height="34" rx="4" fill="#e8f0f4" stroke="#0b6e99"/><text x="170.0" y="162.5" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">İSHAL DURUR</text><text x="170.0" y="175.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3a3533">lümende emilmeyen yük vardı</text>
<rect x="430" y="148" width="220" height="34" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="540.0" y="162.5" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">İSHAL SÜRER</text><text x="540.0" y="175.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3a3533">epitel aktif olarak salgılıyor</text>
<line x1="170" y1="182" x2="170" y2="206" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="540" y1="182" x2="540" y2="206" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="40" y="206" width="260" height="58" rx="4" fill="#e8f0f4" stroke="#0b6e99"/><text x="170.0" y="226.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">OZMOTİK İSHAL</text><text x="170.0" y="239.0" text-anchor="middle" font-size="10.0" font-weight="400" fill="#3a3533">Ozmotik boşluk > 100 mOsm/kg</text><text x="170.0" y="252.0" text-anchor="middle" font-size="10.0" font-weight="400" fill="#3a3533">laktaz eksikliği, Mg laksatif, sorbitol, rotavirüs</text>
<rect x="410" y="206" width="260" height="58" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="540.0" y="226.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">SEKRETUVAR İSHAL</text><text x="540.0" y="239.0" text-anchor="middle" font-size="10.0" font-weight="400" fill="#3a3533">Ozmotik boşluk < 50 mOsm/kg</text><text x="540.0" y="252.0" text-anchor="middle" font-size="10.0" font-weight="400" fill="#3a3533">kolera, ETEC, VIP-oma, safra asidi</text>
<rect x="170" y="282" width="370" height="30" rx="4" fill="#faf7f2" stroke="#3a3533"/><text x="355.0" y="301.0" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">Ozmotik boşluk = 290 − 2 × (dışkı Na⁺ + dışkı K⁺)</text>
<text x="355.0" y="330.0" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6460" font-style="italic">Kanlı, ateşli, tenezmli ise bu akış işletilmez: inflamatuvar ishal düşünülür.</text>
</svg>
