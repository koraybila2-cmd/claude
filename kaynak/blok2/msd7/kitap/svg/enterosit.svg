<svg viewBox="0 0 720 300" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Villus emici hucresi ve kript salgi hucresinde iyon tasinimi">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<rect x="60" y="60" width="230" height="180" rx="6" fill="#fbf9f6" stroke="#3a3533" stroke-width="1.4"/>
<text x="175.0" y="52.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">Villus ucu: EMİCİ hücre</text>
<text x="52.0" y="76.0" text-anchor="end" font-size="10" font-weight="700" fill="#6b6460">Lümen</text>
<text x="298.0" y="76.0" text-anchor="start" font-size="10" font-weight="700" fill="#6b6460">Kan</text>
<rect x="58" y="86" width="86" height="26" rx="4" fill="#e8f0f4" stroke="#0b6e99"/><text x="101.0" y="103.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">SGLT1</text>
<text x="152.0" y="96.0" text-anchor="start" font-size="9.5" font-weight="400" fill="#3a3533">Na⁺ + glukoz</text>
<text x="152.0" y="107.0" text-anchor="start" font-size="8.5" font-weight="400" fill="#6b6460" font-style="italic">(ORS burada çalışır)</text>
<rect x="58" y="130" width="86" height="26" rx="4" fill="#e8f0f4" stroke="#0b6e99"/><text x="101.0" y="147.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">NHE3</text>
<text x="152.0" y="138.0" text-anchor="start" font-size="9.5" font-weight="400" fill="#3a3533">Na⁺ içeri / H⁺ dışarı</text>
<text x="152.0" y="149.0" text-anchor="start" font-size="8.5" font-weight="400" fill="#6b6460" font-style="italic">Cl⁻/HCO₃⁻ ile eşleşir</text>
<rect x="206" y="180" width="86" height="30" rx="4" fill="#e6f0ea" stroke="#2e7d4f"/><text x="249.0" y="192.5" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">Na⁺/K⁺</text><text x="249.0" y="205.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">ATPaz</text>
<text x="198.0" y="188.0" text-anchor="end" font-size="9.5" font-weight="400" fill="#3a3533">Na⁺ dışarı</text>
<text x="198.0" y="200.0" text-anchor="end" font-size="9" font-weight="400" fill="#6b6460" font-style="italic">→ su izler</text>
<line x1="146" y1="99" x2="198" y2="185" stroke="#0b6e99" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<text x="175.0" y="260.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2e7d4f">Net sonuç: Na⁺ ve su EMİLİR</text>
<rect x="420" y="60" width="230" height="180" rx="6" fill="#fbf9f6" stroke="#3a3533" stroke-width="1.4"/>
<text x="535.0" y="52.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">Kript: SALGI yapan hücre</text>
<text x="412.0" y="76.0" text-anchor="end" font-size="10" font-weight="700" fill="#6b6460">Lümen</text>
<text x="658.0" y="76.0" text-anchor="start" font-size="10" font-weight="700" fill="#6b6460">Kan</text>
<rect x="418" y="100" width="86" height="28" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="461.0" y="118.0" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">CFTR</text>
<text x="512.0" y="108.0" text-anchor="start" font-size="9.5" font-weight="400" fill="#3a3533">Cl⁻ lümene</text>
<text x="512.0" y="120.0" text-anchor="start" font-size="8.5" font-weight="400" fill="#6b6460" font-style="italic">Na⁺ ve su peşinden</text>
<rect x="480" y="168" width="110" height="30" rx="4" fill="#f6e9df" stroke="#b4541a"/><text x="535.0" y="180.5" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533">cAMP ↑ / cGMP ↑</text><text x="535.0" y="193.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#3a3533">Ca²⁺ ↑</text>
<line x1="520" y1="166" x2="480" y2="130" stroke="#b4541a" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="535.0" y="260.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8a1c3c">Net sonuç: Cl⁻ ve su SALGILANIR</text>
<rect x="456" y="212" width="158" height="24" rx="4" fill="#fff" stroke="#b4541a"/><text x="535.0" y="228.0" text-anchor="middle" font-size="9" font-weight="400" fill="#3a3533">Kolera toksini · ETEC LT → cAMP</text>
<rect x="456" y="240" width="158" height="22" rx="4" fill="#fff" stroke="#b4541a"/><text x="535.0" y="255.0" text-anchor="middle" font-size="9" font-weight="400" fill="#3a3533">ETEC ST → cGMP</text>
<text x="360.0" y="28.0" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3533">İshalin iki kutbu: emilim mi azaldı, salgı mı arttı?</text>
</svg>
