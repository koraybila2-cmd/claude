<line x1="377" y1="70" x2="408" y2="70" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="102" y1="94" x2="102" y2="122" stroke="#b4541a" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<rect x="20" y="122" width="165" height="62" rx="4" fill="#fff" stroke="#0b6e99"/><text x="102.5" y="144.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">Kolonositin yakıtı</text><text x="102.5" y="157.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">bütirat enerjinin %70'i;</text><text x="102.5" y="170.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">mukus ve sıkı bağlantı ↑</text>
<line x1="267" y1="94" x2="267" y2="122" stroke="#b4541a" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<rect x="185" y="122" width="165" height="62" rx="4" fill="#fff" stroke="#0b6e99"/><text x="267.5" y="144.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">Bariyer güçlenir</text><text x="267.5" y="157.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">epitel yenilenir,</text><text x="267.5" y="170.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">geçirgenlik azalır</text>
<line x1="432" y1="94" x2="432" y2="122" stroke="#b4541a" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<rect x="350" y="122" width="165" height="62" rx="4" fill="#fff" stroke="#0b6e99"/><text x="432.5" y="144.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">Patojene kapalı kapı</text><text x="432.5" y="157.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">asidik ortam C. difficile,</text><text x="432.5" y="170.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">Salmonella, E. coli O157'yi engeller</text>
<line x1="545" y1="94" x2="597" y2="122" stroke="#b4541a" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<rect x="515" y="122" width="165" height="62" rx="4" fill="#fff" stroke="#0b6e99"/><text x="597.5" y="144.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">Bağışıklık dengesi</text><text x="597.5" y="157.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">düzenleyici T hücresi ↑,</text><text x="597.5" y="170.0" text-anchor="middle" font-size="9.0" font-weight="400" fill="#3a3533">iltihap dizginlenir, tolerans sürer</text>
<rect x="120" y="200" width="460" height="30" rx="4" fill="#f6e4ea" stroke="#8a1c3c"/><text x="350.0" y="219.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3533">Antibiyotik → flora bozulur → SCFA azalır → C. difficile çoğalır</text>
</svg>
