<svg viewBox="0 0 700 245" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Kisa zincirli yag asitlerinin uretimi ve islevleri">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<text x="350.0" y="22.0" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3533">Kısa zincirli yağ asitleri: lif nasıl sağlığa dönüşür?</text>
<rect x="20" y="48" width="150" height="44" rx="4" fill="#e6f0ea" stroke="#2e7d4f"/><text x="95.0" y="67.5" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">Diyet lifi</text><text x="95.0" y="80.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3a3533">+ dirençli nişasta</text>
<rect x="205" y="48" width="170" height="44" rx="4" fill="#e6f0ea" stroke="#2e7d4f"/><text x="290.0" y="67.5" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">Kolon bakterileri</text><text x="290.0" y="80.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3a3533">Firmicutes (bütirat)</text>
<rect x="410" y="48" width="270" height="44" rx="4" fill="#f6e9df" stroke="#b4541a"/><text x="545.0" y="67.5" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">Asetat · Propiyonat · BÜTİRAT</text><text x="545.0" y="80.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3a3533">lümen asitleşir (pH ↓)</text>
