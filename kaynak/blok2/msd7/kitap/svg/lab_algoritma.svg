<svg viewBox="0 0 700 356" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Diski kulturunde laktoz negatif koloniden etkene giden algoritma">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<text x="350.0" y="20.0" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3533">Dışkı kültürü: laktoz negatif koloniden etkene</text>
