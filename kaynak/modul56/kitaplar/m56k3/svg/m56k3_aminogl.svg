  <text x="210.0" y="394.2" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">tedavinin 5-10. günü; distal tutulumda poliüri, K⁺ ve Mg²⁺ kaybı</text>
