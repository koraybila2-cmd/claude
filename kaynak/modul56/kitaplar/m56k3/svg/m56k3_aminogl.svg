  <text x="210.0" y="184.2" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">serum düzeyinin 100-1000 katına ulaşır</text>
  <line x1="210" y1="196" x2="210" y2="216" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k3m)"/>
