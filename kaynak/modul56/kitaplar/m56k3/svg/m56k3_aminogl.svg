<svg viewBox="0 0 640 416" width="100%" style="display:block" role="img" aria-label="Aminoglikozid nefrotoksisitesinin basamakları: süzülme, megalin aracılı endositoz, lizozomda birikim, fosfolipidoz, lizozom yırtılması ve hücre ölümü, oligürisiz ABH">
