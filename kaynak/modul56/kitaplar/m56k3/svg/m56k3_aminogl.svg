  <text x="530.0" y="125.8" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">tübülün alım kapasitesi</text>
  <text x="530.0" y="139.8" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">doyduğu için tek yüksek tepe</text>
