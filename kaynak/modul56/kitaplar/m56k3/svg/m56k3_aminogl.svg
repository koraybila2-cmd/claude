  <text x="210.0" y="99.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Bağlanma ve endositoz</text>
  <text x="210.0" y="114.2" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">lümen yüzünde fosfolipid ve megaline bağlanır, hücreye alınır</text>
  <line x1="210" y1="126" x2="210" y2="146" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k3m)"/>
