  <text x="20.0" y="252.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">Hedef ≤130 mmHg ise doğrudan</text>
  <text x="20.0" y="266.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kombinasyonla başlanabilir.</text>
  <text x="20.0" y="294.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">β bloker yalnızca özel nedenle:</text>
  <text x="20.0" y="308.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kalp yetmezliği, KAH, anjina,</text>
  <text x="20.0" y="322.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">atriyal fibrilasyon, gebelik planı.</text>
  <text x="20.0" y="350.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">3-4 ilaçta en az biri ayrı</text>
