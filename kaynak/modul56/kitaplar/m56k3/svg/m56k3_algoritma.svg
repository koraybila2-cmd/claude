  <text x="425.0" y="367.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">dirençli hipertansiyon (önce uyum ve sekonder neden araştırılır)</text>
  <line x1="425" y1="308" x2="425" y2="328" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k3c)"/>
