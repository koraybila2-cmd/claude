<svg viewBox="0 0 640 312" width="100%" style="display:block" role="img" aria-label="Nefrotik sendromda tromboz eğilimi: küçük antikoagülan proteinler idrarla kaybolur, büyük pıhtılaşma proteinleri birikir">
  <defs><marker id="k2n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="k2nc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="k2nm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <rect x="170" y="10" width="300" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="320.0" y="29.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Glomerül bariyeri bozulur</text>
  <text x="320.0" y="44.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">albümin büyüklüğündeki proteinler süzülür</text>
  <path d="M320,56 L320,68 L160,68 L160,84" fill="none" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k2n)"/>
  <path d="M320,56 L320,68 L480,68 L480,84" fill="none" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k2n)"/>
  <rect x="20" y="88" width="280" height="92" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="113.8" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">İdrarla kaybolur</text>
  <text x="160.0" y="129.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">antitrombin III (≈60 kDa)</text>
  <text x="160.0" y="145.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">plazminojen: fibrinoliz azalır</text>
  <text x="160.0" y="161.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">protein C ve S (sunuma göre)</text>
  <rect x="340" y="88" width="280" height="92" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="113.8" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Birikir: idrara geçemez</text>
  <text x="480.0" y="129.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">fibrinojen (≈340 kDa), faktör V, VIII</text>
  <text x="480.0" y="145.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">karaciğerde yapım artmıştır</text>
  <text x="480.0" y="161.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">trombosit agregasyonu, hemokonsantrasyon</text>
  <path d="M160,180 L160,196 L300,196 L300,210" fill="none" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k2n)"/>
  <path d="M480,180 L480,196 L340,196 L340,210" fill="none" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k2n)"/>
  <rect x="120" y="214" width="400" height="52" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="320.0" y="236.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Denge pıhtılaşma yönüne kayar</text>
  <text x="320.0" y="251.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">renal ven trombozu (en sık membranöz), DVT, pulmoner emboli</text>
  <text x="320.0" y="290.0" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="italic" fill="var(--color-accent-700)" xml:space="preserve">Riski en iyi gösteren: serum albümini (&lt;2-2,5 g/dL'de risk yüksek)</text>
</svg>