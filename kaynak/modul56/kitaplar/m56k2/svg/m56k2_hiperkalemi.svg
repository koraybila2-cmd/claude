  <text x="300.0" y="352.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="italic" fill="var(--color-accent-700)" xml:space="preserve">Soru 4.3: K⁺ &gt;6 ve aritmi → acil hemodiyaliz</text>
