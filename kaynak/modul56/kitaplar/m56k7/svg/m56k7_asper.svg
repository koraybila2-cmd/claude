<svg viewBox="0 0 640 298" width="100%" style="display:block" role="img" aria-label="Aspergillus hastalıklarının yelpazesi: aşırı bağışıklık yanıtında alerjik hastalıklar (tanı IgE), normal yanıtta kavitede aspergilloma, yetersiz yanıtta invaziv aspergilloz (tanı galaktomannan)">
  <defs><marker id="k7f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="k7fc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="k7fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <text x="320.0" y="16.0" text-anchor="middle" font-family="var(--font-body)" font-size="11.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Konağın bağışıklık yanıtı</text>
  <line x1="60" y1="30" x2="580" y2="30" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-start="url(#k7f)" marker-end="url(#k7f)"/>
  <text x="60.0" y="46.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">aşırı</text>
  <text x="320.0" y="46.0" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">normal</text>
  <text x="580.0" y="46.0" text-anchor="end" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">yetersiz</text>
  <rect x="8" y="58" width="200" height="232" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="20.0" y="80.0" text-anchor="start" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Alerjik hastalıklar</text>
  <text x="20.0" y="98.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">ABPA, alerjik fungal</text>
  <text x="20.0" y="112.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">sinüzit, astım alevlenmesi</text>
  <text x="20.0" y="134.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">KİMDE</text>
  <text x="20.0" y="148.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">astım, kistik fibrozis, atopi</text>
  <text x="20.0" y="184.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">NASIL</text>
  <text x="20.0" y="198.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">mantar bronşta çoğalır,</text>
  <text x="20.0" y="212.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">dokuya girmez; IgE (tip I)</text>
  <text x="20.0" y="226.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">ve IgG (tip III) yanıtı</text>
  <text x="20.0" y="248.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">TANI</text>
  <text x="20.0" y="262.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">total ve özgül IgE ↑,</text>
  <text x="20.0" y="276.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">eozinofili</text>
  <rect x="220" y="58" width="200" height="232" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="232.0" y="80.0" text-anchor="start" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Aspergilloma</text>
  <text x="232.0" y="98.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">kavitede mantar topu;</text>
  <text x="232.0" y="112.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">kronik pulmoner aspergilloz</text>
  <text x="232.0" y="134.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">KİMDE</text>
  <text x="232.0" y="148.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">eski tüberküloz kavitesi,</text>
  <text x="232.0" y="162.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">yapısal akciğer hastalığı</text>
  <text x="232.0" y="184.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">NASIL</text>
  <text x="232.0" y="198.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">mantar boşlukta çoğalır,</text>
  <text x="232.0" y="212.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">dokuya girmez</text>
  <text x="232.0" y="248.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">TANI</text>
  <text x="232.0" y="262.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">görüntüleme,</text>
  <text x="232.0" y="276.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">Aspergillus IgG</text>
  <rect x="432" y="58" width="200" height="232" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="444.0" y="80.0" text-anchor="start" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">İnvaziv aspergilloz</text>
  <text x="444.0" y="98.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">akciğerde kanamalı enfarkt,</text>
  <text x="444.0" y="112.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">yaygın enfeksiyon</text>
  <text x="444.0" y="134.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">KİMDE</text>
  <text x="444.0" y="148.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">nötropeni, kök hücre nakli,</text>
  <text x="444.0" y="162.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">yüksek doz steroid</text>
  <text x="444.0" y="184.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">NASIL</text>
  <text x="444.0" y="198.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">hifa dokuya ve damar</text>
  <text x="444.0" y="212.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">duvarına girer (anjioinvazyon)</text>
  <text x="444.0" y="248.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">TANI</text>
  <text x="444.0" y="262.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">serumda ve BAL'da</text>
  <text x="444.0" y="276.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">galaktomannan</text>
