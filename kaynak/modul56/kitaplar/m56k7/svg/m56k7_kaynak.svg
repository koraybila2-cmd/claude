<svg viewBox="0 0 640 262" width="100%" style="display:block" role="img" aria-label="Kaynağa göre dermatofitler: antropofilik türler insandan insana geçer ve hafif, kronik enfeksiyon yapar; zoofilik ve jeofilik türler hayvandan ve topraktan geçer, şiddetli ve akut enfeksiyon yapar">
