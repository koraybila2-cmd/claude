<svg viewBox="0 0 760 326" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Pihtilasma kaskadi ve antikoagulan ilaclarin hedefleri">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<text x="200" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">İç yol (aPTT)</text>
<text x="200" y="38" text-anchor="middle" font-size="11" font-weight="400" fill="#3a3533">XII → XI → IX (+VIIIa)</text>
<text x="460" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">Dış yol (PT)</text>
<text x="460" y="38" text-anchor="middle" font-size="11" font-weight="400" fill="#3a3533">Doku faktörü + VIIa</text>
<line x1="220" y1="46" x2="290" y2="84" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="440" y1="46" x2="370" y2="84" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="270" y="88" width="120" height="34" rx="4" fill="#eef6f9" stroke="#0088b0"/><text x="330.0" y="103.0" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3533">Faktör Xa</text><text x="330.0" y="116.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3a3533">(+ Va)</text>
<line x1="330" y1="122" x2="330" y2="152" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="270" y="156" width="120" height="34" rx="4" fill="#eef6f9" stroke="#0088b0"/><text x="330.0" y="177.0" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3533">Trombin (IIa)</text>
<line x1="330" y1="190" x2="330" y2="220" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="255" y="224" width="150" height="30" rx="4" fill="#f7f4f2" stroke="#57534e"/><text x="330.0" y="243.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">Fibrinojen → Fibrin</text>
<rect x="460" y="288" width="140" height="28" rx="4" fill="#f7f4f2" stroke="#57534e"/><text x="530.0" y="306.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3a3533">Plazminojen → Plazmin</text>
<line x1="460" y1="300" x2="370" y2="260" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="392" y="296" text-anchor="middle" font-size="9.5" font-weight="400" fill="#3a3533" font-style="italic">fibrini eritir</text>
<text x="12" y="100" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Heparin (antitrombin ile):</text>
<text x="12" y="113" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Xa ve IIa</text>
<path d="M264,105 H240 V173 H264" fill="none" stroke="#8a1c3c" stroke-width="1.2"/>
<line x1="240" y1="105" x2="180" y2="105" stroke="#8a1c3c" stroke-width="1.2"/>
<text x="12" y="136" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">DMAH (enoksaparin): Xa &gt; IIa</text>
<text x="12" y="156" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Fondaparinuks: yalnız Xa</text>
<text x="402" y="100" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Rivaroksaban, apiksaban, edoksaban:</text>
<text x="402" y="113" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Xa (doğrudan, ağızdan)</text>
<text x="402" y="170" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Dabigatran (ağızdan), bivalirudin,</text>
<text x="402" y="183" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">argatroban: IIa (doğrudan)</text>
<text x="12" y="204" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Varfarin: karaciğerde II, VII, IX, X</text>
<text x="12" y="217" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">(ve protein C, S) yapımı ↓</text>
<text x="610" y="298" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">Streptokinaz, alteplaz,</text>
<text x="610" y="311" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">tenekteplaz: etkinleştirir</text>
<text x="12" y="300" text-anchor="start" font-size="10" font-weight="400" fill="#3a3533">Trombosit tıkacı: aspirin (TXA2), klopidogrel-tikagrelor (P2Y12),</text>
<text x="12" y="313" text-anchor="start" font-size="10" font-weight="400" fill="#3a3533">absiksimab-tirofiban (GP IIb/IIIa)</text>
</svg>
