  <line x1="60" y1="133" x2="60" y2="158" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M211,109 L224,109 L224,234 L203,234" fill="none" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="12.0" y="272.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">sağ art. sternoclavicularis</text>
  <text x="12.0" y="285.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">arkasında ikiye ayrılır</text>
  <rect x="240" y="160" width="390" height="190" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="250.0" y="178.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">A. subclavia'nın dalları (her iki tarafta aynı)</text>
  <text x="250.0" y="193.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">1. bölüm (m. scalenus anterior'un medialinde)</text>
  <text x="250.0" y="209.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">A. vertebralis → C6 foramen transversarium → beyin</text>
  <text x="250.0" y="224.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">A. thoracica interna → a. pericardiacophrenica,</text>
  <text x="250.0" y="240.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">   aa. intercostales ant., a. musculophrenica, a. epigastrica sup.</text>
  <text x="250.0" y="255.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">Truncus thyrocervicalis → a. thyroidea inferior,</text>
  <text x="250.0" y="271.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">   a. cervicalis ascendens, a. suprascapularis, a. transversa cervicis</text>
  <text x="250.0" y="286.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">2. bölüm (kasın arkasında)</text>
  <text x="250.0" y="302.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">Truncus costocervicalis → a. intercostalis suprema (1-2. İKA)</text>
  <text x="250.0" y="317.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">   ve a. cervicalis profunda</text>
  <text x="250.0" y="333.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">3. bölüm (kasın lateralinde) → a. dorsalis scapulae</text>
  <line x1="530" y1="133" x2="530" y2="158" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>