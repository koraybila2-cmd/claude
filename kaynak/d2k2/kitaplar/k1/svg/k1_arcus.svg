<svg viewBox="0 0 640 360" width="100%" style="display:block" role="img" aria-label="Arcus aortae'nin dalları ve a. subclavia'nın dalları">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <rect x="200" y="8" width="240" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="320.0" y="27.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Arcus aortae</text>
  <text x="320.0" y="42.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">manubrium arkası · T4'te sonlanır</text>
  <rect x="10" y="86" width="200" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="110.0" y="105.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">1 · Truncus brachiocephalicus</text>
  <text x="110.0" y="120.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">en kalın dal · ≈4-5 cm</text>
  <rect x="250" y="86" width="140" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="320.0" y="105.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">2 · A. carotis</text>
  <text x="320.0" y="120.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">communis sinistra</text>
  <rect x="430" y="86" width="200" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="530.0" y="105.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">3 · A. subclavia sinistra</text>
  <text x="530.0" y="120.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">arcus'un son dalı</text>
  <line x1="260" y1="55" x2="140" y2="84" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="320" y1="55" x2="320" y2="84" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="380" y1="55" x2="500" y2="84" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="10" y="160" width="190" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="105.0" y="183.6" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">A. carotis communis dextra</text>
  <rect x="10" y="214" width="190" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
