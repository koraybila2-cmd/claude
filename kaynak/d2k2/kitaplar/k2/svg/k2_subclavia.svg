<svg viewBox="0 0 660 330" width="100%" style="display:block" role="img" aria-label="A. subclavia'nın m. scalenus anterior'a göre üç bölümü ve dalları">
  <defs><marker id="sc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="scc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="scm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <text x="330.0" y="14.0" text-anchor="middle" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">M. SCALENUS ANTERIOR ARTERİ ÜÇ BÖLÜME AYIRIR</text>
  <rect x="10" y="26" width="200" height="64" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="110.0" y="47.8" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">1. bölüm</text>
  <text x="110.0" y="61.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">başlangıçtan kasın medial</text>
  <text x="110.0" y="75.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kenarına kadar · en çok dal</text>
  <rect x="230" y="26" width="200" height="64" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="330.0" y="47.8" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">2. bölüm</text>
  <text x="330.0" y="61.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kasın arkasında, plexus brachialis</text>
  <text x="330.0" y="75.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">ile birlikte · en kısa, en yüksek</text>
  <rect x="450" y="26" width="200" height="64" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="550.0" y="47.8" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">3. bölüm</text>
  <text x="550.0" y="61.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kasın lateralinden 1. kaburganın</text>
  <text x="550.0" y="75.8" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">dış kenarına → a. axillaris</text>
  <line x1="211" y1="58" x2="228" y2="58" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#sc)"/>
  <line x1="431" y1="58" x2="448" y2="58" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#sc)"/>
  <rect x="10" y="110" width="200" height="210" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="20.0" y="128.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">1. bölümün dalları</text>
  <text x="20.0" y="143.5" text-anchor="start" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">A. vertebralis</text>
  <text x="20.0" y="159.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">C6 for. transversarium →</text>
  <text x="20.0" y="174.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">for. magnum → beyin</text>
  <text x="20.0" y="190.0" text-anchor="start" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">A. thoracica interna</text>
  <text x="20.0" y="205.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">sternumun ≈1 cm lateralinde iner,</text>
  <text x="20.0" y="221.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">6. İKA'da a. musculophrenica</text>
  <text x="20.0" y="236.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">(7-9. İKA) + a. epigastrica sup.</text>
  <text x="20.0" y="252.0" text-anchor="start" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Truncus thyrocervicalis</text>
  <text x="20.0" y="267.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">a. thyroidea inferior,</text>
  <text x="20.0" y="283.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">a. suprascapularis,</text>
  <text x="20.0" y="298.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">a. transversa colli</text>
  <rect x="230" y="110" width="200" height="120" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="240.0" y="128.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">2. bölümün dalı</text>
  <text x="240.0" y="144.0" text-anchor="start" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Truncus costocervicalis</text>
  <text x="240.0" y="160.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">a. intercostalis suprema</text>
  <text x="240.0" y="176.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">→ 1. ve 2. İKA</text>
  <text x="240.0" y="192.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">a. cervicalis profunda</text>
  <text x="240.0" y="208.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">→ ensenin derin kasları</text>
  <rect x="450" y="110" width="200" height="120" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="460.0" y="128.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">3. bölüm ve sonrası</text>
  <text x="460.0" y="144.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">(a. dorsalis scapulae bazen</text>
  <text x="460.0" y="160.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">buradan çıkar)</text>
  <text x="460.0" y="176.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">Kol arkaya-aşağı çekilince</text>
  <text x="460.0" y="192.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">arter klavikula ile 1. kaburga</text>
  <text x="460.0" y="208.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">arasında sıkışır</text>
  <rect x="230" y="246" width="420" height="74" rx="4" fill="white" stroke="var(--color-accent-2-900)" stroke-width="1.5"/>
  <text x="240.0" y="264.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="700" font-style="normal" fill="var(--color-accent-2-900)" xml:space="preserve">Sağ-sol farkı</text>
  <text x="240.0" y="279.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">Sağ: truncus brachiocephalicus'tan, sağ art.</text>
  <text x="240.0" y="295.0" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">sternoclavicularis'in arkasında çıkar. Sol: arcus aortae'nin</text>
  <text x="240.0" y="310.5" text-anchor="start" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">3. dalı (T4), göğüs içi bölümü olduğu için daha uzundur.</text>
</svg>