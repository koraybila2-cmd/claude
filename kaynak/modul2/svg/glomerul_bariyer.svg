<svg viewBox="0 0 680 330" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Glomeruler filtrasyon bariyeri ve immun kompleks yerlesim yerleri">
  <!-- lumen -->
  <rect x="150" y="20" width="420" height="60" fill="#fdecec" stroke="none"/>
  <text x="360" y="45" text-anchor="middle" font-size="12" font-weight="700">Kılcal damar lümeni (kan)</text>
  <text x="360" y="63" text-anchor="middle" font-size="10.5">eritrosit, albümin (negatif yüklü)</text>
  <!-- endothelium with fenestrae -->
  <g fill="#f6c9b5" stroke="#9a5b3f">
    <rect x="150" y="82" width="70" height="18" rx="4"/><rect x="232" y="82" width="70" height="18" rx="4"/><rect x="314" y="82" width="70" height="18" rx="4"/><rect x="396" y="82" width="70" height="18" rx="4"/><rect x="478" y="82" width="92" height="18" rx="4"/>
  </g>
  <text x="140" y="96" text-anchor="end" font-size="11" font-weight="700">1. Pencereli endotel</text>
  <!-- subendothelial deposit -->
  <ellipse cx="268" cy="106" rx="16" ry="6" fill="#b42318"/>
  <!-- GBM -->
  <rect x="150" y="112" width="420" height="34" fill="#dbe7f3" stroke="#4a6f94"/>
  <rect x="150" y="122" width="420" height="14" fill="#a9c2dc" stroke="none"/>
  <text x="140" y="133" text-anchor="end" font-size="11" font-weight="700">2. Bazal membran</text>
  <text x="140" y="147" text-anchor="end" font-size="9.5">tip IV kollajen, negatif yük</text>
  <!-- subepithelial deposit -->
  <ellipse cx="452" cy="152" rx="16" ry="6" fill="#b42318"/>
  <!-- podocyte foot processes -->
  <g fill="#cfe8d5" stroke="#3f7d52">
    <path d="M160,158 h40 v22 q-20,10 -40,0 z"/><path d="M212,158 h40 v22 q-20,10 -40,0 z"/><path d="M264,158 h40 v22 q-20,10 -40,0 z"/><path d="M316,158 h40 v22 q-20,10 -40,0 z"/><path d="M368,158 h40 v22 q-20,10 -40,0 z"/><path d="M420,158 h40 v22 q-20,10 -40,0 z"/><path d="M472,158 h40 v22 q-20,10 -40,0 z"/><path d="M524,158 h40 v22 q-20,10 -40,0 z"/>
  </g>
  <g stroke="#3f7d52" stroke-width="2"><line x1="200" y1="160" x2="212" y2="160"/><line x1="252" y1="160" x2="264" y2="160"/><line x1="304" y1="160" x2="316" y2="160"/><line x1="356" y1="160" x2="368" y2="160"/><line x1="408" y1="160" x2="420" y2="160"/><line x1="512" y1="160" x2="524" y2="160"/></g>
  <text x="140" y="172" text-anchor="end" font-size="11" font-weight="700">3. Podosit ayakçıkları</text>
  <text x="140" y="186" text-anchor="end" font-size="9.5">yarık diyafram: nefrin</text>
  <rect x="150" y="196" width="420" height="34" fill="#f4f1ea" stroke="none"/>
  <text x="360" y="218" text-anchor="middle" font-size="12" font-weight="700">Bowman boşluğu (idrar)</text>
  <!-- mesangium -->
  <rect x="590" y="40" width="80" height="170" rx="10" fill="#efe6f7" stroke="#6b4c8a"/>
  <text x="630" y="62" text-anchor="middle" font-size="11" font-weight="700">Mezangiyum</text>
  <ellipse cx="630" cy="120" rx="16" ry="6" fill="#b42318"/>
  <!-- labels for deposits -->
  <g font-size="10.5" fill="#b42318" font-weight="700">
    <text x="20" y="262">● Subendotelyal: lupus sınıf IV, MPGN → kan tarafında, ağır iltihap, NEFRİTİK</text>
    <text x="20" y="282">● Subepitelyal: membranöz (PLA2R), poststreptokokal hörgüç → süzgeç bozulur, NEFROTİK (membranöz)</text>
    <text x="20" y="302">● Mezangiyal: IgA nefropatisi, Henoch-Schönlein purpurası → tekrarlayan HEMATÜRİ</text>
    <text x="20" y="322">Anti-GBM: antikor bazal membranın kendisine bağlanır → çizgisel boyanma, hilal, hızlı ilerleyen GN</text>
  </g>
  <line x1="268" y1="106" x2="268" y2="106"/>
</svg>
