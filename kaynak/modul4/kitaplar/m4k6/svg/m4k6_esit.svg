  <text x="105.0" y="246.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">tehlikeli spor; ilk benimseyenlerin</text>
  <text x="105.0" y="260.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">geçici sağlık avantajı</text>
