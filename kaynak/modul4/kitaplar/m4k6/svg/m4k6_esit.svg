  <text x="530.0" y="142.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Doğal, biyolojik fark</text>
  <text x="530.0" y="156.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">yaşlıda kronik hastalık çok,</text>
  <text x="530.0" y="170.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">yalnız erkekte prostat kanseri</text>
