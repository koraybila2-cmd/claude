  <line x1="425" y1="294" x2="425" y2="318" stroke="var(--color-accent-700)" stroke-width="1.5" marker-end="url(#m46ac)"/>
  <rect x="220" y="320" width="410" height="46" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="425.0" y="339.1" text-anchor="middle" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">Hedef: hakkaniyet (equity)</text>
  <text x="425.0" y="354.1" text-anchor="middle" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">herkesin sağlık potansiyeline tam ulaşabilmesi; politikayla azaltılabilir</text>
  <text x="10.0" y="300.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">İlk iki kutudaki farklar da birer</text>
  <text x="10.0" y="313.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">eşitsizliktir (inequality), ama</text>
  <text x="10.0" y="326.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">hakkaniyetsizlik sayılmaz.</text>
