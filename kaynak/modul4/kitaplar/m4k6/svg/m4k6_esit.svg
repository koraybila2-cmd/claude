  <rect x="150" y="142" width="260" height="52" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="280.0" y="163.5" text-anchor="middle" font-family="var(--font-body)" font-size="11.6" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Fark, kişinin seçimi dışındaki</text>
  <text x="280.0" y="179.5" text-anchor="middle" font-family="var(--font-body)" font-size="11.6" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">sosyal koşullardan mı doğuyor?</text>
