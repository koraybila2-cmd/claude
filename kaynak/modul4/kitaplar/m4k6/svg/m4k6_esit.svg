  <rect x="220" y="222" width="410" height="72" rx="4" fill="white" stroke="var(--color-accent-2-900)" stroke-width="1.5"/>
  <text x="425.0" y="245.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.2" font-weight="700" font-style="normal" fill="var(--color-accent-2-900)" xml:space="preserve">HAKKANİYETSİZLİK (inequity)</text>
  <text x="425.0" y="261.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.2" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">kaçınılabilir ve adaletsiz: yoksulluk, eğitimsizlik, kötü konut ve iş</text>
