<svg viewBox="0 0 640 244" width="100%" style="display:block" role="img" aria-label="Bronsektazi patogenezinde obstruksiyon ve enfeksiyonun kisir dongusu">
  <defs><marker id="m43d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="m43dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="m43dm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <rect x="10" y="10" width="280" height="64" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="150.0" y="30.6" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">1. Obstrüksiyon ya da temizlik bozukluğu</text>
  <text x="150.0" y="45.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">tümör, yabancı cisim, mukus tıkacı;</text>
  <text x="150.0" y="60.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kistik fibrozis, silyer diskinezi</text>
  <rect x="350" y="10" width="280" height="64" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="490.0" y="30.6" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">2. Sekresyonlar birikir</text>
  <text x="490.0" y="45.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">normal temizleme engellenir,</text>
  <text x="490.0" y="60.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">sekonder enfeksiyon gelişir</text>
  <rect x="350" y="160" width="280" height="64" rx="4" fill="white" stroke="var(--color-accent-2-900)" stroke-width="1.5"/>
  <text x="490.0" y="180.6" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">3. Kronik nekrotizan inflamasyon</text>
  <text x="490.0" y="195.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">nötrofil proteazları, bakteri toksinleri:</text>
  <text x="490.0" y="210.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kas, elastik doku, kıkırdak yıkılır</text>
  <rect x="10" y="160" width="280" height="64" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="150.0" y="180.6" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">4. Duvar zayıflar, kalıcı dilatasyon</text>
  <text x="150.0" y="195.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">silindirik ya da sakküler genişleme;</text>
  <text x="150.0" y="210.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.3" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">dilate bronşta temizlik daha da bozulur</text>
