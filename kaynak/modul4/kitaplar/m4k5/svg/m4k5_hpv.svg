<svg viewBox="0 0 640 350" width="100%" style="display:block" role="img" aria-label="Hipoksiye yanit: sistemik arteriolde vazodilatasyon, pulmoner arteriolde vazokonstriksiyon">
  <defs><marker id="m45b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="m45bc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="m45bm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <text x="160.0" y="16.0" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Sistemik arteriol</text>
  <text x="480.0" y="16.0" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Pulmoner arteriol</text>
  <rect x="15" y="28" width="290" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="44.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Doku hipoksisi</text>
  <text x="160.0" y="58.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">dokuda O₂ ↓</text>
  <rect x="15" y="82" width="290" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="98.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">K⁺ kanalları (KATP) açılır</text>
  <text x="160.0" y="112.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">NO, adenozin, PGI₂ salınır</text>
  <line x1="160" y1="68" x2="160" y2="80" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#m45b)"/>
  <rect x="15" y="136" width="290" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="152.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Hiperpolarizasyon</text>
  <text x="160.0" y="166.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">Ca²⁺ girişi ↓</text>
  <line x1="160" y1="122" x2="160" y2="134" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#m45b)"/>
  <rect x="15" y="190" width="290" height="40" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="160.0" y="206.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">VAZODİLATASYON</text>
  <text x="160.0" y="220.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">hipoksik dokuya daha çok kan gider</text>
  <line x1="160" y1="176" x2="160" y2="188" stroke="var(--color-accent-700)" stroke-width="1.5" marker-end="url(#m45bc)"/>
  <rect x="335" y="28" width="290" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="44.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Alveoler hipoksi</text>
  <text x="480.0" y="58.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">alveolde O₂ ↓</text>
  <rect x="335" y="82" width="290" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="98.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">O₂'ye duyarlı Kv kanalları kapanır</text>
  <text x="480.0" y="112.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">K⁺ çıkışı azalır</text>
  <line x1="480" y1="68" x2="480" y2="80" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#m45b)"/>
  <rect x="335" y="136" width="290" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="152.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Depolarizasyon</text>
  <text x="480.0" y="166.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">L-tipi Ca²⁺ kanalları açılır, Ca²⁺ girer</text>
  <line x1="480" y1="122" x2="480" y2="134" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#m45b)"/>
  <rect x="335" y="190" width="290" height="40" rx="4" fill="white" stroke="var(--color-accent-2-900)" stroke-width="1.5"/>
  <text x="480.0" y="206.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.4" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">VAZOKONSTRİKSİYON</text>
  <text x="480.0" y="220.4" text-anchor="middle" font-family="var(--font-body)" font-size="9.9" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kan iyi havalanan alveollere yönelir</text>
  <line x1="480" y1="176" x2="480" y2="188" stroke="var(--color-accent-2-900)" stroke-width="1.5" marker-end="url(#m45bm)"/>
  <line x1="480" y1="230" x2="480" y2="252" stroke="var(--color-accent-2-900)" stroke-width="1.5" marker-end="url(#m45bm)"/>
  <rect x="15" y="254" width="610" height="90" rx="4" fill="white" stroke="var(--color-accent-2-900)" stroke-width="1.5"/>
  <text x="25.0" y="276.0" text-anchor="start" font-family="var(--font-body)" font-size="10.2" font-weight="700" font-style="normal" fill="var(--color-accent-2-900)" xml:space="preserve">Hipoksi bütün akciğerde ve sürekli olursa (KOAH, yüksek rakım, hipoventilasyon)</text>
  <text x="25.0" y="293.0" text-anchor="start" font-family="var(--font-body)" font-size="10.2" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">· Bütün pulmoner arterioller birlikte daralır. Yerel V/Q uyumu sağlayan refleks, direnci artıran bir yüke dönüşür.</text>
  <text x="25.0" y="310.0" text-anchor="start" font-family="var(--font-body)" font-size="10.2" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">· HIF-1α aracılığıyla düz kas ve fibroblastlar çoğalır: damar duvarı kalıcı olarak kalınlaşır.</text>
  <text x="25.0" y="327.0" text-anchor="start" font-family="var(--font-body)" font-size="10.2" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">· Sonuç pulmoner hipertansiyondur. Oksijen, bu daralmayı geri çeviren tek tedavidir.</text>
</svg>