  <text x="470.0" y="140.0" text-anchor="middle" font-family="var(--font-body)" font-size="9.6" font-weight="700" font-style="normal" fill="var(--color-accent-700)" xml:space="preserve">4 mm = 0,16 sn</text>
  <text x="325.0" y="192.0" text-anchor="middle" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-accent-2-900)" xml:space="preserve">sağ atriyum büyümesi: cor pulmonale</text>
  <text x="535.0" y="192.0" text-anchor="middle" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-text)" xml:space="preserve">sol atriyum büyümesi: mitral darlık</text>
  <text x="10.0" y="222.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">Izgara: 1 küçük kare = 1 mm = 0,04 sn (25 mm/sn kayıt hızında) ve 0,1 mV.</text>
