<svg viewBox="0 0 640 350" width="100%" style="display:block" role="img" aria-label="Aort koarktasyonunda kollateral dolasim ve kaburga centiklenmesinin mekanizmasi">
  <defs><marker id="k73c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="k73cc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="k73cm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <rect x="150" y="8" width="340" height="46" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="320.0" y="27.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Aort koarktasyonu</text>
  <text x="320.0" y="42.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">a. subclavia sinistra çıkışının hemen distalinde darlık</text>
  <line x1="320" y1="54" x2="320" y2="76" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k73c)"/>
  <rect x="150" y="78" width="340" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="320.0" y="97.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Proksimalde yüksek basınç</text>
  <text x="320.0" y="112.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">a. subclavia → a. thoracica interna genişler</text>
  <line x1="320" y1="124" x2="320" y2="146" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k73c)"/>
  <rect x="150" y="148" width="340" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="320.0" y="167.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Aa. intercostales anteriores</text>
  <text x="320.0" y="182.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">her aralıkta posterior arterlerle anastomoz</text>
  <line x1="320" y1="194" x2="320" y2="216" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k73c)"/>
  <rect x="150" y="218" width="340" height="46" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="320.0" y="237.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Aa. intercostales posteriores'te akım tersine döner</text>
  <text x="320.0" y="252.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kan aortaya, darlığın distaline ulaşır → alt vücut</text>
  <line x1="320" y1="264" x2="320" y2="286" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k73c)"/>
  <rect x="150" y="288" width="340" height="52" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="320.0" y="310.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Genişleyen, kıvrılan posterior arterler (3-8)</text>
  <text x="320.0" y="325.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kaburganın alt kenarını aşındırır → kaburga çentiklenmesi</text>
  <rect x="500" y="148" width="136" height="116" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="568.0" y="171.9" text-anchor="middle" font-family="var(--font-body)" font-size="11.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">1. ve 2. kaburgalar</text>
  <text x="568.0" y="186.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">korunur: arterleri</text>
  <text x="568.0" y="201.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">a. intercostalis suprema</text>
  <text x="568.0" y="216.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">üzerinden darlığın</text>
  <text x="568.0" y="231.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">proksimalinden gelir;</text>
  <text x="568.0" y="246.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">ters akım olmaz</text>
  <rect x="4" y="148" width="136" height="116" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="72.0" y="171.9" text-anchor="middle" font-family="var(--font-body)" font-size="11.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Kollateraller</text>
  <text x="72.0" y="186.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">yetmez:</text>
  <text x="72.0" y="201.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">kolda yüksek, bacakta</text>
  <text x="72.0" y="216.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">düşük basınç;</text>
  <text x="72.0" y="231.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">radyal-femoral</text>
  <text x="72.0" y="246.9" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">nabız gecikmesi</text>
</svg>