<svg viewBox="0 0 640 500" width="100%" style="display:block" role="img" aria-label="Hava yolu duz kasinin parasempatik ve sempatik innervasyonu; ipratropium ve tiotropiumun M3 reseptorunu bloke ettigi nokta, salbutamol ve formoterolun beta2 reseptorunu uyardigi nokta">
  <defs><marker id="k76b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-neutral-700)"/></marker><marker id="k76bc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-700)"/></marker><marker id="k76bm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-2-900)"/></marker></defs>
  <text x="160.0" y="16.0" text-anchor="middle" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">PARASEMPATİK</text>
  <text x="480.0" y="16.0" text-anchor="middle" font-family="var(--font-body)" font-size="10" font-weight="700" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve" letter-spacing="0.08em">SEMPATİK</text>
  <rect x="40" y="26" width="240" height="42" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="43.1" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">N. vagus (preganglionik)</text>
  <text x="160.0" y="58.1" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">beyin sapı → göğüs</text>
  <line x1="160" y1="68" x2="160" y2="88" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <rect x="40" y="90" width="240" height="42" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="107.1" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Gangliyonlar: pulmoner pleksus</text>
  <text x="160.0" y="122.1" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">ve bronş duvarı (kısa postganglionik)</text>
  <line x1="160" y1="132" x2="160" y2="190" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <text x="170.0" y="152.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">asetilkolin</text>
  <line x1="143.0" y1="172" x2="177.0" y2="172" stroke="var(--color-accent-2-900)" stroke-width="2.5"/>
  <text x="182.0" y="176.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="italic" fill="var(--color-accent-2-900)" xml:space="preserve">ipratropium (kısa etkili)</text>
  <text x="182.0" y="188.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="italic" fill="var(--color-accent-2-900)" xml:space="preserve">tiotropium (uzun etkili)</text>
  <rect x="40" y="192" width="240" height="42" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="160.0" y="209.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">M₃ reseptörü</text>
  <text x="160.0" y="224.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">düz kas ve bez hücresi</text>
  <line x1="160" y1="234" x2="160" y2="254" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <rect x="40" y="256" width="240" height="42" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="273.1" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Gq → fosfolipaz C → IP₃</text>
  <text x="160.0" y="288.1" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">hücre içi Ca²⁺ ↑</text>
  <line x1="160" y1="298" x2="160" y2="318" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <rect x="40" y="320" width="240" height="52" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="160.0" y="334.8" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Bronkokonstriksiyon</text>
  <text x="160.0" y="349.8" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">mukus salgısı ↑; pulmoner damarlarda</text>
  <text x="160.0" y="364.8" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">vazodilatasyon</text>
  <rect x="360" y="26" width="240" height="42" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="43.1" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">T2-T4 yan boynuz (preganglionik)</text>
  <text x="480.0" y="58.1" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">sempatik gövde</text>
  <line x1="480" y1="68" x2="480" y2="88" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <rect x="360" y="90" width="240" height="42" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="107.0" text-anchor="middle" font-family="var(--font-body)" font-size="11.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Servikal ve üst torakal gangliyonlar</text>
  <text x="480.0" y="122.0" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">postganglionik lif: noradrenalin (az)</text>
  <rect x="500" y="140" width="130" height="40" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="565.0" y="156.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Dolaşımdaki</text>
  <text x="565.0" y="170.4" text-anchor="middle" font-family="var(--font-body)" font-size="11.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">adrenalin (adrenal)</text>
  <line x1="480" y1="132" x2="480" y2="190" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <line x1="565" y1="180" x2="565" y2="190" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <text x="362.0" y="150.0" text-anchor="start" font-family="var(--font-body)" font-size="10.5" font-weight="700" font-style="normal" fill="var(--color-accent-2-900)" xml:space="preserve">salbutamol, formoterol</text>
  <text x="362.0" y="162.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="italic" fill="var(--color-accent-2-900)" xml:space="preserve">(β₂ agonist: yolu</text>
  <text x="362.0" y="174.0" text-anchor="start" font-family="var(--font-body)" font-size="10" font-weight="400" font-style="italic" fill="var(--color-accent-2-900)" xml:space="preserve">taklit eder)</text>
  <line x1="430" y1="176" x2="468" y2="190" stroke="var(--color-accent-2-900)" stroke-width="1.5" marker-end="url(#k76bm)"/>
  <rect x="360" y="192" width="240" height="42" rx="4" fill="white" stroke="var(--color-accent-700)" stroke-width="1.5"/>
  <text x="480.0" y="209.2" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">β₂ reseptörü</text>
  <text x="480.0" y="224.2" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">düz kas hücresi</text>
  <line x1="480" y1="234" x2="480" y2="254" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <rect x="360" y="256" width="240" height="42" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="273.1" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Gs → adenilil siklaz → cAMP ↑</text>
  <text x="480.0" y="288.1" text-anchor="middle" font-family="var(--font-body)" font-size="11" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">protein kinaz A</text>
  <line x1="480" y1="298" x2="480" y2="318" stroke="var(--color-neutral-700)" stroke-width="1.5" marker-end="url(#k76b)"/>
  <rect x="360" y="320" width="240" height="52" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="480.0" y="334.8" text-anchor="middle" font-family="var(--font-body)" font-size="12.5" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Bronkodilatasyon</text>
  <text x="480.0" y="349.8" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">Ca²⁺ sarkoplazmik retikuluma alınır;</text>
  <text x="480.0" y="364.8" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">bezlerde salgı ↓; damarlarda konstriksiyon</text>
  <rect x="40" y="392" width="560" height="96" rx="4" fill="white" stroke="var(--color-neutral-700)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="320.0" y="413.6" text-anchor="middle" font-family="var(--font-body)" font-size="12" font-weight="700" font-style="normal" fill="var(--color-text)" xml:space="preserve">Aynı düz kas hücresinde iki zıt sinyal</text>
  <text x="320.0" y="428.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">Vagus tonusu dinlenimde bile hava yolunu hafif daraltır; bu tonus gece artar.</text>
  <text x="320.0" y="443.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">Antimuskarinik ilaç bu tonusu kaldırarak, β₂ agonist ise aynı hücrede ters yönde bir sinyal başlatarak</text>
  <text x="320.0" y="458.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">bronşu genişletir. İnsan hava yolu düz kasında sempatik sinir ucu azdır: β₂ reseptörlerini daha çok</text>
  <text x="320.0" y="473.6" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" font-weight="400" font-style="normal" fill="var(--color-neutral-700)" xml:space="preserve">dolaşımdaki adrenalin uyarır.</text>
</svg>