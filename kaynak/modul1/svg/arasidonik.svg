<svg viewBox="0 0 700 300" width="100%" style="display:block;font-family:Source Serif 4,Georgia,serif" role="img" aria-label="Arasidonik asit yolu ve ilaclarin etki noktalari">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3533"/></marker></defs>
<rect x="240" y="14" width="220" height="32" rx="4" fill="#f7f4f2" stroke="#57534e"/><text x="350.0" y="34.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">Zar fosfolipitleri</text>
<line x1="350" y1="46" x2="350" y2="76" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="362" y="64" text-anchor="start" font-size="10.5" font-weight="400" fill="#3a3533">fosfolipaz A2</text>
<text x="200" y="64" text-anchor="end" font-size="10.5" font-weight="700" fill="#8a1c3c">✕ glukokortikoidler</text>
<rect x="250" y="80" width="200" height="32" rx="4" fill="#eef6f9" stroke="#0088b0"/><text x="350.0" y="100.0" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3533">Araşidonik asit</text>
<line x1="310" y1="112" x2="190" y2="150" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="390" y1="112" x2="520" y2="150" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="230" y="132" text-anchor="end" font-size="10.5" font-weight="700" fill="#3a3533">COX-1, COX-2</text>
<text x="20" y="116" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">✕ NSAİİ, aspirin (geri dönüşsüz),</text>
<text x="20" y="130" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">   koksibler (yalnız COX-2)</text>
<text x="465" y="132" text-anchor="start" font-size="10.5" font-weight="700" fill="#3a3533">5-lipoksijenaz</text>
<text x="560" y="146" text-anchor="start" font-size="10.5" font-weight="700" fill="#8a1c3c">✕ zileuton</text>
<rect x="120" y="154" width="140" height="30" rx="4" fill="#fff" stroke="#3a3533"/><text x="190.0" y="173.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">PGH2</text>
<rect x="450" y="154" width="150" height="30" rx="4" fill="#fff" stroke="#3a3533"/><text x="525.0" y="173.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a3533">Lökotrienler</text>
<text x="560" y="204" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3a3533">bronş daralması, kemotaksi</text>
<text x="560" y="218" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533" font-style="italic">(montelukast reseptörü bloke eder)</text>
<text x="560" y="236" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533" font-style="italic">COX kapanınca araşidonik asit buraya kayar:</text>
<text x="560" y="250" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3533" font-style="italic">aspirine duyarlı astım</text>
<line x1="150" y1="184" x2="75" y2="226" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="190" y1="184" x2="225" y2="226" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<line x1="230" y1="184" x2="375" y2="226" stroke="#3a3533" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="15" y="230" width="120" height="30" rx="4" fill="#fff" stroke="#3a3533"/><text x="75.0" y="249.0" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">PGE2</text>
<rect x="165" y="230" width="120" height="30" rx="4" fill="#fff" stroke="#3a3533"/><text x="225.0" y="249.0" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">PGI2</text>
<rect x="315" y="230" width="120" height="30" rx="4" fill="#fff" stroke="#3a3533"/><text x="375.0" y="249.0" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3533">TXA2</text>
<text x="75" y="276" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533">ağrı eşiği ↓, ateş,</text>
<text x="75" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533">mide koruma, böbrek akımı</text>
<text x="225" y="276" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533">endotelde (COX-2):</text>
<text x="225" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533">antiagregan, vazodilatör</text>
<text x="375" y="276" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533">trombositte (COX-1):</text>
<text x="375" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#3a3533">agregasyon, vazokonstriksiyon</text>
</svg>
